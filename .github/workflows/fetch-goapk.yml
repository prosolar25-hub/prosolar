name: Build goapk Linux
on:
  push:
    branches: [ sbc-v38-apk-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build goapk from source
        run: |
          go install github.com/zapstore/goapk@latest
          cp "$(go env GOPATH)/bin/goapk" ./goapk
          chmod +x ./goapk
          ./goapk version
          file ./goapk
      - uses: actions/upload-artifact@v4
        with:
          name: goapk-linux-amd64
          path: goapk
          if-no-files-found: error
